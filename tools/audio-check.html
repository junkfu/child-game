<h1>注音音檔驗收</h1>
<p class="lead">
這是 <code>tools/make-audio.sh</code> 產生的 130 個音檔。請逐一聽過，
<strong>特別注意 ㄈ ㄝ ㄟ ㄥ ㄜ ㄦ ㄤ ㄠ</strong>（這幾個在國語裡找不到同音的一聲字，
是最可能出問題的）。拼讀音節請確認聽起來是「ㄅㄚ」這樣一個完整的音，
而不是「ㄅㄛ－ㄚ」兩段。<br>
覺得哪個唸得不對，shift+點標成黃色，之後可以換字重產或自己錄音覆蓋同名檔。
</p>

<script>
const BASE='../dist/games/zhuyin/audio/';
let audio=null,queue=null;
function play(btn){
  if(audio){audio.pause();}
  audio=new Audio(BASE+btn.dataset.f);
  audio.play().catch(e=>alert('播不出來：'+e.message+'\n如果是用 file:// 開啟，某些瀏覽器會擋，改用 python3 -m http.server 試試。'));
  btn.classList.add('played');
  btn.scrollIntoView({block:'center',behavior:'smooth'});
  return audio;
}
document.querySelectorAll('button[data-f]').forEach(b=>b.addEventListener('click',e=>{
  if(e.shiftKey){b.classList.toggle('flag');return;}
  play(b);
}));
function playAll(){
  const list=[...document.querySelectorAll('button[data-f]')];let i=0;
  stopAll();
  queue=()=>{ if(i>=list.length){queue=null;return;} const a=play(list[i++]); a.onended=()=>queue&&queue(); };
  queue();
}
function stopAll(){ queue=null; if(audio){audio.pause();audio.onended=null;} }
</script>
