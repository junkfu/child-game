<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf7f2">
<meta name="description" content="給 4-5 歲小朋友的注音符號遊戲：聽音找符號、看圖配注音、描寫筆順、注音拼讀。餵點心、找寶石、收集可愛夥伴。">
<title>注音大冒險</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23e8833a'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E3%84%85%3C/text%3E%3C/svg%3E">
<script>
  /* 在第一次繪製前就決定主題，defer 的腳本會先閃一下錯的顏色 */
  try {
    var s = JSON.parse(localStorage.getItem('kid-games-v1') || '{}');
    var p = s && s.games && s.games.zhuyin && s.games.zhuyin.profile;
    if (p) document.documentElement.dataset.theme = p;
  } catch (e) {}
</script>
<link rel="stylesheet" href="../../shared/shell.css?v=1">
<link rel="stylesheet" href="zhuyin.css?v=3">
</head>
<body>

<header class="topbar">
  <a class="brand" href="../../index.html">
    <span class="brand-mark" aria-hidden="true">←</span>
    <span>注音大冒險<small>小怪獸的點心派對</small></span>
  </a>
  <div class="top-actions">
    <button class="btn btn-ghost" id="switch-profile">換成太空樂園</button>
    <button class="icon-btn" id="sound" aria-pressed="true" aria-label="關閉聲音">♫</button>
  </div>
</header>

<!-- 封面：選版本 -->
<main class="wrap" data-screen="cover">
  <div class="cover">
    <h1>注音<em>大冒險</em></h1>
    <p>小怪獸肚子餓了！<br>找對注音餅乾，邀請牠一起野餐。</p>
    <div class="picker">
      <button class="pick" data-profile="girl">
        <span class="pick-face" data-friend-art="1"></span>
        <strong>點心花園</strong>
        <span>蝴蝶、草莓、娃娃</span>
      </button>
      <button class="pick" data-profile="boy">
        <span class="pick-face" data-friend-art="0"></span>
        <strong>太空樂園</strong>
        <span>恐龍、火箭、汽車</span>
      </button>
    </div>
    <p class="cover-note">每次 5–7 個小任務・沒有倒數・可以一直試</p>
  </div>
</main>

<!-- 單元地圖 -->
<main class="wrap" data-screen="map" hidden>
  <div class="map-head">
    <span class="eyebrow">MONSTER PICNIC CLUB</span><h1>今天，和誰一起玩？</h1>
    <p id="map-progress">已完成 0 / 10 關</p>
  </div>
  <div class="map-actions"><button class="btn btn-primary" id="quick-start">▶ 開始點心任務</button><button class="btn btn-ghost" id="practice">✎ 練習上次的符號與描寫</button><button class="btn btn-ghost" id="write-all">✏ ㄅㄆㄇ寫字</button></div>
  <div class="unit-map" id="unit-map"></div>
</main>

<!-- 遊戲進行中 -->
<main id="play" class="wrap play-wrap" data-screen="play" hidden>
  <div class="play-head">
    <button class="btn btn-ghost" id="quit"><span aria-hidden="true">←</span> 回地圖</button>
    <div class="play-meta">
      <strong id="unit-title">第 1 關</strong>
      <span id="step-count">1 / 1</span>
    </div>
  </div>
  <div class="meter play-meter"><i id="step-fill"></i></div>
  <div id="snack-trail" class="snack-trail"></div>
  <div id="stage" class="stage"></div>
</main>

<!-- 寫字：37 個符號排成一張表，點哪個就描哪個，描完自動接下一個 -->
<main class="wrap write-wrap" data-screen="write" hidden>
  <div class="play-head">
    <button class="btn btn-ghost" id="write-back"><span aria-hidden="true">←</span> 回地圖</button>
    <div class="play-meta">
      <strong>ㄅㄆㄇ寫字</strong>
      <span id="write-progress">已描 0 / 37</span>
    </div>
  </div>
  <div class="write-layout">
    <section class="write-desk">
      <div id="write-stage" class="write-stage"></div>
      <div class="write-nav">
        <button class="btn" id="write-prev"><span aria-hidden="true">◀</span> 上一個</button>
        <button class="btn btn-ghost" id="write-say" aria-label="再聽一次這個符號">🔊</button>
        <button class="btn" id="write-next">下一個 <span aria-hidden="true">▶</span></button>
      </div>
    </section>
    <section class="write-board" id="write-board" aria-label="選一個符號來描"></section>
  </div>
</main>

<!-- 單元結算 -->
<main class="wrap" data-screen="done" hidden>
  <div class="done card">
    <div id="done-art"></div>
    <h1 id="done-title">完成！</h1>
    <div class="stars done-stars" id="done-stars"></div>
    <p id="done-copy"></p>
    <button class="btn btn-primary" id="done-next">下一關，出發！ →</button>
    <button class="btn btn-ghost" id="replay-unit">再餵一次，換新題目</button>
    <button class="btn btn-ghost" id="to-map">回關卡地圖</button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../shared/storage.js?v=1" defer></script>
<script src="../../shared/audio.js?v=1" defer></script>
<script src="../../shared/core.js?v=1" defer></script>
<script src="data/symbols.js?v=1" defer></script>
<script src="data/strokes.js?v=1" defer></script>
<script src="data/words.js?v=2" defer></script>
<script src="data/syllables.js?v=1" defer></script>
<script src="glyph.js?v=1" defer></script>
<script src="quiz.js?v=1" defer></script>
<script src="modes/meet.js?v=2" defer></script>
<script src="modes/listen.js?v=1" defer></script>
<script src="modes/picture.js?v=1" defer></script>
<script src="modes/blend.js?v=1" defer></script>
<script src="modes/trace.js?v=2" defer></script>
<script src="modes/adventure.js?v=4" defer></script>
<script src="write.js?v=1" defer></script>
<script src="zhuyin.js?v=3" defer></script>
</body>
</html>
