<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f6fc">
<meta name="description" content="給幼兒園小朋友的網頁小遊戲合輯：找碴遊戲、注音符號學習。不限時、不扣分，免安裝。">
<title>小玩具盒</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%238156d9'/%3E%3Ccircle cx='23' cy='26' r='8' fill='%23ffe08a'/%3E%3Ccircle cx='41' cy='26' r='8' fill='%23ed87ac'/%3E%3Crect x='15' y='38' width='34' height='9' rx='4.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/shell.css?v=1">
<style>
  .hero { text-align: center; padding: clamp(20px, 5vw, 44px) 0 clamp(18px, 4vw, 32px); }
  .hero h1 { margin-bottom: 10px; }
  .hero h1 em { font-style: normal; color: var(--brand); }
  .hero p { color: var(--ink-soft); font-size: clamp(14px, 2.2vw, 17px); }

  .games { display: grid; gap: clamp(14px, 2.5vw, 20px); grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

  .game-card {
    display: flex; flex-direction: column; gap: 14px;
    text-align: left; text-decoration: none; color: inherit;
    background: var(--card); border: 2px solid var(--line);
    border-radius: var(--radius-lg); padding: clamp(18px, 3vw, 26px);
    box-shadow: 0 5px 0 var(--shadow);
    transition: transform .15s, border-color .15s;
  }
  .game-card:hover { transform: translateY(-3px); border-color: var(--tint, var(--brand)); }
  .game-card:active { transform: translateY(1px); box-shadow: 0 2px 0 var(--shadow); }

  .game-head { display: flex; align-items: center; gap: 14px; }
  .game-icon {
    width: 66px; height: 66px; flex: none;
    display: grid; place-items: center;
    border-radius: 20px; font-size: 34px; font-weight: 700;
    background: color-mix(in srgb, var(--tint) 15%, var(--card));
    color: var(--tint);
  }
  .game-card h2 { font-size: clamp(18px, 2.6vw, 22px); }
  .game-card .sub { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }

  .game-foot { display: flex; align-items: center; gap: 12px; margin-top: auto; }
  .game-foot .meter { flex: 1; }
  .game-foot .meter > i { background: var(--tint); }
  .game-foot .count { font-size: 13px; font-weight: 700; color: var(--ink-faint); white-space: nowrap; }
  .game-card .go { font-size: 15px; font-weight: 700; color: var(--tint); }

  .soon {
    display: grid; place-items: center; gap: 8px; text-align: center;
    border: 2px dashed var(--line); border-radius: var(--radius-lg);
    padding: clamp(18px, 3vw, 26px); min-height: 190px;
    color: var(--ink-faint); font-size: 14px;
  }
  .soon span { font-size: 34px; opacity: .5; }

  .note { margin-top: clamp(20px, 4vw, 34px); text-align: center; font-size: 13px; color: var(--ink-faint); line-height: 1.9; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true">🧸</span>
    <span>小玩具盒<small>陪小朋友玩一下下</small></span>
  </a>
  <div class="top-actions">
    <button class="icon-btn" id="sound" aria-pressed="true" aria-label="關閉聲音">♫</button>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1>今天想玩<em>哪一個</em>？</h1>
    <p>都不限時、不扣分，慢慢玩就好 ♡</p>
  </div>
  <div class="games" id="games"></div>
  <p class="note">
    進度會記在這台裝置的瀏覽器裡，換裝置或清除瀏覽資料就會重來。<br>
    右上角 <strong>♫</strong> 可以關掉聲音，兩個遊戲共用這個設定。
  </p>
</main>

<footer>✧ 每一個小發現，都值得拍拍手。</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="shared/storage.js?v=1" defer></script>
<script src="shared/audio.js?v=1" defer></script>
<script src="shared/core.js?v=1" defer></script>
<script src="shared/catalog.js?v=3" defer></script>
<script src="menu.js?v=3" defer></script>
</body>
</html>
